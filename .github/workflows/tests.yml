name: Tests

# Runs for every push to main and every pull request. OS input and screen capture are
# faked, so this does not replace the real-device checks in tools/.
#
# - Windows: the whole suite offscreen, then the layout and font checks again with the real
#   platform plugin (spin boxes are 32 px offscreen but 30 px on screen, and Windows
#   offscreen has no system fonts).
# - macOS: only those layout and font checks, with the real cocoa plugin. The whole suite is
#   run on a real Mac instead: on the macos-15 runner (a 3-CPU VM) threads wake 25-75 ms
#   late (5-10 ms on a real Mac), so the 25-150 ms stop-latency budgets fail every run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Tests ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            whole_suite: true
            platform_plugin: windows
            platform_args: ""
          - os: macos-15
            label: macos-arm64
            whole_suite: false
            platform_plugin: cocoa
            # "unstyled" clears only the style sheet; run alone it then gets the native
            # macOS style, which the app never uses (apply_theme always sets the Fusion
            # based AppStyle) and which is 9 px wider than the panel at 1100x680.
            platform_args: -k "not unstyled"
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install
        shell: bash
        run: uv sync --frozen --all-extras

      # A shared runner can wake a sleeping thread late, so a stop-latency check may miss
      # its budget at random. Failed tests run once more; a real slowdown fails again, and
      # anything that passed only on the retry is listed as a warning on the run.
      - name: pytest (offscreen, whole suite)
        if: matrix.whole_suite
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set +e
          uv run --no-sync pytest -rfEs --junitxml=junit-${{ matrix.label }}.xml
          status=$?
          if [ "$status" -eq 1 ]; then
            uv run --no-sync python -c "import json; [print(f'::warning title=Retried test::{t}') for t in json.load(open('.pytest_cache/v/cache/lastfailed'))]"
            uv run --no-sync pytest -rfEs --last-failed --junitxml=junit-${{ matrix.label }}-retry.xml
            status=$?
          fi
          exit "$status"

      - name: pytest (${{ matrix.platform_plugin }} platform plugin, layout and fonts)
        if: always()
        shell: bash
        env:
          QT_QPA_PLATFORM: ${{ matrix.platform_plugin }}
        run: >-
          uv run --no-sync pytest -p no:cacheprovider -rfEs
          --junitxml=junit-${{ matrix.label }}-${{ matrix.platform_plugin }}.xml ${{ matrix.platform_args }}
          "tests/unit/test_gui_p2_inspector.py::test_inspector_fits_the_panel_without_sideways_overflow"
          "tests/unit/test_gui_p2_refix.py::test_buttons_honour_the_28_and_32_pixel_heights"
          "tests/unit/test_gui_p2_refix.py::test_styled_inspector_spin_boxes_are_pinned_to_the_line_edit_height"
          "tests/unit/test_gui_theme_icons.py::test_fonts_are_platform_fonts"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.label }}
          path: junit-*.xml
          retention-days: 14
