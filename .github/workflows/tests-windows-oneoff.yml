name: Tests (Windows, one-off)

# Temporary: runs the test suite on a Windows runner for test/windows-0.1.1 only, to list
# the tests that fail on Windows. Removed again before the branch is merged.

on:
  push:
    branches: ["test/windows-0.1.1"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install
        shell: bash
        run: uv sync --frozen --all-extras

      - name: pytest
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: uv run --no-sync pytest -p no:cacheprovider -rfEs --junitxml=junit-windows.xml

      # Layout and font checks that fail offscreen: do they pass with the real platform plugin?
      - name: pytest (windows platform plugin)
        if: always()
        shell: bash
        env:
          QT_QPA_PLATFORM: windows
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: >-
          uv run --no-sync pytest -p no:cacheprovider -rfEs --junitxml=junit-windows-platform.xml
          "tests/unit/test_gui_p2_inspector.py::test_inspector_fits_the_panel_without_sideways_overflow"
          "tests/unit/test_gui_p2_refix.py::test_buttons_honour_the_28_and_32_pixel_heights"
          "tests/unit/test_gui_theme_icons.py::test_fonts_are_platform_fonts"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-windows
          path: junit-windows*.xml
          retention-days: 7
